<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="72%">
      <stop offset="0" stop-color="#112449"/>
      <stop offset="0.55" stop-color="#081028"/>
      <stop offset="1" stop-color="#03060f"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.18" stop-color="#d6f1ff"/>
      <stop offset="0.45" stop-color="#47b3ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2a6bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="o1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8b4ff"/>
      <stop offset="0.5" stop-color="#7cc8ff"/>
      <stop offset="1" stop-color="#e9f7ff"/>
    </linearGradient>
    <linearGradient id="o2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#6fb6ff"/>
      <stop offset="1" stop-color="#b48cff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <!-- orbits: three different tilts and eccentricities -->
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <ellipse cx="256" cy="256" rx="210" ry="62" transform="rotate(-18 256 256)" stroke="url(#o1)" stroke-width="9"/>
    <ellipse cx="256" cy="256" rx="200" ry="88" transform="rotate(52 256 256)" stroke="url(#o2)" stroke-width="8"/>
    <ellipse cx="256" cy="256" rx="185" ry="48" transform="rotate(108 256 256)" stroke="url(#o1)" stroke-width="7" opacity="0.85"/>
  </g>
  <!-- nucleus with a four-point flare -->
  <circle cx="256" cy="256" r="110" fill="url(#halo)"/>
  <g fill="#e8f7ff" filter="url(#soft)" opacity="0.9">
    <path d="M256 150 L264 248 L362 256 L264 264 L256 362 L248 264 L150 256 L248 248 Z"/>
  </g>
  <circle cx="256" cy="256" r="26" fill="#ffffff" filter="url(#glow)"/>
  <!-- electrons -->
  <g fill="#ffffff" filter="url(#glow)">
    <circle cx="456" cy="191" r="12"/>
    <circle cx="199" cy="432" r="11"/>
    <circle cx="133" cy="98" r="10"/>
  </g>
</svg>
